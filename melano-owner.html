<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Melano · خاوەن</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@500;700;800;900&family=Outfit:wght@700;900&display=swap">
<style>
:root{--bg:#0e1116;--panel:#161b22;--ink:#e6edf3;--muted:#8b98a5;--line:#273039;--brand:#ff7a1a;--ok:#22c55e;--soft:#1b2430;--f:"Vazirmatn",Tahoma,sans-serif;--fd:"Outfit",var(--f);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.6}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px 50px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top b{font-family:var(--fd);font-weight:900;font-size:1.4rem}
.login{max-width:360px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;display:grid;gap:12px}
.login h1{font-family:var(--fd);text-align:center;margin:0}.login .ic{font-size:44px;text-align:center}
input{font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:inherit;font-weight:900;border:0;border-radius:13px;padding:13px;cursor:pointer;background:linear-gradient(135deg,var(--brand),#ff9a3c);color:#1a0f02}
.btn.sm{padding:9px 14px;font-size:.88rem}.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.msg{color:#ff8a74;font-weight:700;text-align:center;min-height:1.2em}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat span{color:var(--muted);font-size:13px}.stat b{display:block;font-size:26px;font-weight:900;font-family:var(--fd)}
.stat.rev b{color:var(--ok)}.stat.pend b{color:var(--brand)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px}
h2{font-family:var(--fd);font-size:1.1rem;margin:0 0 12px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:13px}
.pill{font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}
.pill.pending{background:rgba(255,122,26,.16);color:var(--brand)}
.pill.accepted{background:rgba(91,147,255,.16);color:#7aa2ff}
.pill.delivered{background:rgba(34,197,94,.16);color:var(--ok)}
.drv{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);gap:10px}
.drv b{font-weight:800}.drv .cnt{font-family:var(--fd);font-weight:900}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.row .f{display:grid;gap:4px;flex:1;min-width:120px}.row label{font-size:13px;color:var(--muted)}
.live{font-size:.72rem;color:var(--muted);display:inline-flex;align-items:center;gap:5px}.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.3}}
.cfg{background:#3a1b14;color:#ff9a84;padding:8px 12px;font-size:12px;text-align:center}
.empty{color:var(--muted);text-align:center;padding:16px}
</style>
</head>
<body>
<div id="cfgWarn" class="cfg" hidden>⚠️ تکایە KEY لە سەرەوەی کۆدەکە دابنێ</div>

<section id="login" class="login">
  <div class="ic">👑</div>
  <h1>پانێڵی خاوەن</h1>
  <input id="pin" type="password" placeholder="PIN ی خاوەن" autocomplete="current-password">
  <button class="btn" id="go">چوونەژوورەوە</button>
  <p class="msg" id="lmsg"></p>
</section>

<div id="app" class="wrap" hidden>
  <div class="top"><b>👑 Melano · خاوەن</b><div style="display:flex;gap:10px;align-items:center"><span class="live"><span class="dot"></span>زیندوو</span><button class="btn ghost sm" id="out">دەرچوون</button></div></div>
  <div class="stats" id="stats"></div>

  <div class="card">
    <h2>🛵 گەیەنەرەکان</h2>
    <div id="drivers"></div>
    <h2 style="margin-top:16px;font-size:1rem">زیادکردنی گەیەنەری نوێ</h2>
    <div class="row">
      <div class="f"><label>ناو</label><input id="ndName" placeholder="ناوی گەیەنەر"></div>
      <div class="f"><label>PIN</label><input id="ndPin" placeholder="PIN"></div>
      <button class="btn sm" id="addDrv">زیادکردن</button>
    </div>
    <p class="msg" id="drvMsg" style="color:var(--ok)"></p>
  </div>

  <div class="card">
    <h2>📋 داواکارییەکان (دوایین ١٠٠)</h2>
    <div class="tbl"><table><thead><tr><th>ژمارە</th><th>کات</th><th>کڕیار</th><th>ناونیشان</th><th>دۆخ</th><th>گەیەنەر</th><th>کۆ</th></tr></thead><tbody id="orders"></tbody></table></div>
  </div>
</div>

<script>
const SUPA = "https://ytcoveaoimutrhxshinl.supabase.co/rest/v1/rpc/";
const KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl0Y292ZWFvaW11dHJoeHNoaW5sIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjc2MTYsImV4cCI6MjEwODk0MzYxNn0.3Pi1oOlXsuLa7H32raI9bo6xitqa6qZHOdqs_1NwOLM";
const $ = id => document.getElementById(id);
const money = n => Number(n||0).toLocaleString("en-US") + " د.ع";
const nf = n => Number(n||0).toLocaleString("en-US");
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ST = {pending:"چاوەڕوان",accepted:"لە ڕێگا",delivered:"گەیەنرا"};
if (KEY.indexOf("PASTE")===0) $("cfgWarn").hidden=false;
async function rpc(fn, body){ const r=await fetch(SUPA+fn,{method:"POST",headers:{"Content-Type":"application/json",apikey:KEY,Authorization:"Bearer "+KEY},body:JSON.stringify(body||{})}); return r.json(); }

let pin="", timer=null;
try{ pin=sessionStorage.getItem("mln_own")||""; }catch(e){}

async function login(){
  const p=$("pin").value.trim(); if(!p)return; $("go").disabled=true; $("lmsg").textContent="";
  let r; try{ r=await rpc("owner_data",{p_pin:p}); }catch(e){ r=null; }
  $("go").disabled=false;
  if(!r||!r.ok){ $("lmsg").textContent="PIN هەڵەیە."; return; }
  pin=p; try{ sessionStorage.setItem("mln_own",pin); }catch(e){} enter(r);
}
function enter(data){ $("login").hidden=true; $("app").hidden=false; if(data)paint(data); loop(); clearInterval(timer); timer=setInterval(loop,5000); }
$("go").onclick=login; $("pin").onkeydown=e=>{if(e.key==="Enter")login();};
$("out").onclick=()=>{ clearInterval(timer); try{sessionStorage.removeItem("mln_own");}catch(e){} location.reload(); };

async function loop(){ let r; try{ r=await rpc("owner_data",{p_pin:pin}); }catch(e){ return; } if(!r||!r.ok){ clearInterval(timer); $("login").hidden=false; $("app").hidden=true; return; } paint(r); }
function paint(d){
  const s=d.stats||{};
  $("stats").innerHTML=`
    <div class="stat"><span>کۆی داواکارییەکان</span><b>${nf(s.total)}</b></div>
    <div class="stat pend"><span>چاوەڕوان</span><b>${nf(s.pending)}</b></div>
    <div class="stat"><span>لە ڕێگا</span><b>${nf(s.active)}</b></div>
    <div class="stat"><span>گەیەنراو</span><b>${nf(s.delivered)}</b></div>
    <div class="stat rev"><span>داهاتی گەیەنراو</span><b>${money(s.revenue)}</b></div>`;
  $("drivers").innerHTML=(d.drivers||[]).length?(d.drivers.map(dr=>`<div class="drv"><div><b>${esc(dr.name)}</b> <span style="color:var(--muted);font-size:.8rem">(PIN: ${esc(dr.pin)})</span></div><div class="cnt">✅ ${nf(dr.delivered)} گەیەنراو${dr.active?` · 🛵 ${nf(dr.active)} لە ڕێگا`:""}</div></div>`).join("")):`<div class="empty">هێشتا گەیەنەر نییە.</div>`;
  $("orders").innerHTML=(d.orders||[]).length?(d.orders.map(o=>`<tr><td><b>${esc(o.num)}</b></td><td style="color:var(--muted)">${esc(o.t)}</td><td>${esc(o.cust_name)}<br><span style="color:var(--muted);font-size:.8rem" dir="ltr">${esc(o.cust_phone)}</span></td><td style="white-space:normal;max-width:220px">${esc(o.address)}</td><td><span class="pill ${o.status}">${ST[o.status]||o.status}</span></td><td>${esc(o.driver_name||"—")}</td><td>${money(o.total)}</td></tr>`).join("")):`<tr><td colspan="7" class="empty">هێشتا داواکاری نییە.</td></tr>`;
}
$("addDrv").onclick=async()=>{
  const n=$("ndName").value.trim(), p=$("ndPin").value.trim(); if(!n||!p)return;
  $("addDrv").disabled=true;
  const r=await rpc("owner_add_driver",{p_pin:pin,p_name:n,p_dpin:p});
  $("addDrv").disabled=false;
  if(r&&r.ok){ $("drvMsg").textContent="✅ گەیەنەر زیاد کرا"; $("ndName").value="";$("ndPin").value=""; loop(); setTimeout(()=>$("drvMsg").textContent="",2500); }
  else $("drvMsg").textContent="نەکرا.";
};
if(pin) rpc("owner_data",{p_pin:pin}).then(r=>{ if(r&&r.ok)enter(r); }).catch(()=>{});
</script>
</body>
</html>
